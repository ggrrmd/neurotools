<script>/* Dados do médico (salvos neste aparelho em "Dados do médico") usados nos documentos */
window.NTMED = (function () {
  function c() { try { return JSON.parse(localStorage.getItem('lme_cfg') || 'null') || {}; } catch (e) { return {}; } }
  return {
    get nome() { var x = c(); return x.medicoNomeCurto || x.medicoNome || '[nome do médico]'; },
    get crm() { return c().crm || '[CRM]'; },
    get rqe() { return c().rqe || ''; },
    get especialidade() { return c().especialidade || 'Neurologista'; },
    get registro() { var x = c(); return [x.especialidade || 'Neurologista', x.crm || '[CRM]', x.rqe].filter(Boolean).join(' · '); },
    get cidade() { return c().cidade || ''; },
    get endereco() { var x = c(); return [x.endereco, x.cidade, x.uf].filter(Boolean).join(', '); },
    get contato() { var x = c(); return [x.email, x.telefone].filter(Boolean).join(' | '); }
  };
})();</script>
<script>/* Ponte entre cada ferramenta (carregada dentro do menu) e o artefato.
   Só age quando a página está dentro do Neurotools publicado como artefato;
   fora dele não faz nada. */
(function () {
  var host = null;
  try { host = window.parent !== window ? window.parent.auxNeuroHost : null; } catch (e) { host = null; }
  if (!host) return;

  // A coluna lateral do Neurotools substitui o botão flutuante "Menu".
  try {
    var est = document.createElement("style");
    est.textContent = "#auxneuro-menu{display:none!important}";
    (document.head || document.documentElement).appendChild(est);
  } catch (e) {}

  // Repassa à ferramenta os recursos do Claude que o menu recebe
  // (salvamento de arquivos e arquivo de pacientes do LME).
  // Arquivos e dados criados aqui são recriados na página principal (structuredClone dela)
  // antes de chegar ao Claude, que só aceita objetos da página principal.
  try {
    var pai = window.parent;
    if (!window.claude && pai.claude && typeof pai.claude.use === "function") {
      var clonar = function (x) { return (x === undefined || x === null || typeof x !== "object") ? x : pai.structuredClone(x); };
      var embrulharDoc = function (d) {
        return {
          set: function (dados, opc) { return d.set(clonar(dados), clonar(opc)); },
          update: function (dados) { return d.update(clonar(dados)); },
          delete: function () { return d.delete(); },
          get: function () { return d.get(); },
          onSnapshot: function (a, b) { return d.onSnapshot(a, b); }
        };
      };
      var embrulharCol = function (c) {
        return {
          doc: function (id) { return embrulharDoc(c.doc(id)); },
          onSnapshot: function (a, b) { return c.onSnapshot(a, b); },
          get: function () { return c.get(); }
        };
      };
      window.claude = {
        use: function (nome) {
          return pai.claude.use(nome).then(function (ns) {
            if (!ns) return ns;
            if (nome === "downloads") {
              return { save: function (req) { return ns.save({ filename: req.filename, data: clonar(req.data) }); } };
            }
            if (nome === "db") {
              return {
                collection: function (p) { return embrulharCol(ns.collection(p)); },
                doc: function (p) { return embrulharDoc(ns.doc(p)); }
              };
            }
            return ns;
          });
        }
      };
    }
  } catch (e) {}

  // Guarda os arquivos gerados para entregá-los ao salvamento do artefato.
  var blobs = new Map();
  var criar = URL.createObjectURL;
  URL.createObjectURL = function (obj) {
    var url = criar.call(URL, obj);
    if (obj instanceof Blob) blobs.set(url, obj);
    return url;
  };

  function ehArquivo(a) {
    return a && a.hasAttribute && a.hasAttribute("download") && /^(blob:|data:)/i.test(a.href || "");
  }
  function salvar(a) {
    var nome = a.getAttribute("download") || "arquivo";
    var blob = blobs.get(a.href);
    var pronto = blob ? Promise.resolve(blob) : fetch(a.href).then(function (r) { return r.blob(); });
    pronto.then(function (b) { host.salvar(nome, b); }, function () { host.aviso("Não foi possível preparar o arquivo."); });
  }

  // Downloads disparados por código (a.click()) e por clique do usuário.
  var clicar = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (ehArquivo(this)) { salvar(this); return; }
    return clicar.call(this);
  };
  document.addEventListener("click", function (e) {
    var alvo = e.target && e.target.closest ? e.target : null;
    if (!alvo) return;
    var menu = alvo.closest("#auxneuro-menu");
    if (menu) { e.preventDefault(); host.voltar(); return; }
    var a = alvo.closest("a[download]");
    if (ehArquivo(a)) { e.preventDefault(); salvar(a); }
  }, true);

  // O artefato não exibe confirm()/alert(): a ação confirma direto e o aviso vira mensagem na tela.
  window.confirm = function () { return true; };
  window.alert = function (m) { host.aviso(String(m)); };
})();
</script>

@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap');
.uw *{box-sizing:border-box}
.uw{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;color:${y.ink};background:${y.paper};min-height:100vh;-webkit-font-smoothing:antialiased}
.uw .disp{font-family:'Newsreader',Georgia,serif;font-weight:600;letter-spacing:-.01em}
.uw .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.uw .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:${y.ink45};font-weight:600}
.uw input,.uw select,.uw textarea{font-family:inherit;font-size:13.5px;color:${y.ink};background:${y.card};border:1px solid ${y.rule};border-radius:5px;padding:7px 9px;width:100%;outline:none}
.uw input:focus,.uw select:focus,.uw textarea:focus{border-color:${y.pine};box-shadow:0 0 0 3px rgba(31,75,63,.13)}
.uw label.f{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:${y.ink45};font-weight:600;margin-bottom:4px}
.uw .card{background:${y.card};border:1px solid ${y.rule};border-radius:9px}
.uw .seg{display:flex;gap:3px}
.uw .sb{flex:1;min-width:30px;height:32px;border:1px solid ${y.rule};border-radius:4px;background:${y.card};color:${y.ink45};font-size:12.5px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;transition:transform .09s ease,background .12s ease;display:flex;align-items:center;justify-content:center}
.uw .sb:hover{transform:translateY(-1px);border-color:${y.pine}}
.uw .sb:focus-visible{outline:2px solid ${y.pine};outline-offset:2px}
.uw .sb.on{border-color:transparent}
.uw .btn{border:1px solid ${y.rule};background:${y.card};color:${y.ink};border-radius:6px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s ease}
.uw .btn:hover{background:#F2F4F5}
.uw .btn.pri{background:${y.pine};border-color:${y.pine};color:#fff}
.uw .btn.pri:hover{background:#173B31}
.uw .btn.sm{padding:5px 10px;font-size:11.5px}
.uw .btn:focus-visible{outline:2px solid ${y.pine};outline-offset:2px}
.uw .tab{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:${y.ink45};padding:10px 2px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.01em;white-space:nowrap}
.uw .tab:hover{color:${y.ink70}}
.uw .tab[aria-selected="true"]{color:${y.pine};border-bottom-color:${y.pine}}
.uw .tab:focus-visible{outline:2px solid ${y.pine};outline-offset:2px}
.uw .tabbar{display:flex;flex-wrap:wrap;column-gap:22px;row-gap:0}
@media(max-width:720px){.uw .tab{font-size:12.5px}.uw .tabbar{column-gap:16px}}
@media(max-width:430px){.uw .tab{font-size:12px;padding:9px 2px}.uw .tabbar{column-gap:13px}}
.uw .row{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:11px 14px;border-bottom:1px solid ${y.ruleSoft};align-items:start}
.uw .row:last-child{border-bottom:none}
.uw .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.uw .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.uw .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.uw .shell{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:1180px;margin:0 auto;padding:22px 16px 90px}
.uw .shell>*{min-width:0}
@media(max-width:600px){.uw .seg,.uw .seg>*{min-width:0}.uw .sb{min-width:22px}.uw div.mono{white-space:normal!important}}
.uw .grid2>*,.uw .grid3>*{min-width:0}
.uw .card table{max-width:100%}
@media(min-width:1000px){.uw .shell{grid-template-columns:minmax(0,1fr) 328px;padding:30px 24px 40px}.uw aside{position:sticky;top:22px;align-self:start;max-height:calc(100vh - 44px);overflow:auto}}
@media(max-width:640px){.uw .grid3,.uw .grid4{grid-template-columns:1fr}}
.uw .spine{height:7px;border-radius:4px;background:${y.ruleSoft};overflow:hidden;display:flex}
.uw .pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:${y.pine};background:#EAF0ED;border-radius:3px;padding:2px 6px}
.uw table.g{width:100%;border-collapse:collapse;font-size:12.5px}
.uw table.g th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:${y.ink45};font-weight:600;padding:7px 8px;border-bottom:1px solid ${y.rule}}
.uw table.g td{padding:8px;border-bottom:1px solid ${y.ruleSoft};vertical-align:top}
.uw table.g tr.base td{background:#F3F7F5;font-weight:600}
.uw .chip{border:1px solid ${y.rule};background:${y.card};color:${y.ink45};border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .12s ease}
.uw .chip:hover{border-color:${y.pine};color:${y.ink70}}
.uw .chip.on{background:${y.pine};border-color:${y.pine};color:#fff}
.uw .chip:focus-visible{outline:2px solid ${y.pine};outline-offset:2px}
.uw .ter{border:1px solid ${y.ruleSoft};border-radius:7px;padding:11px 12px;margin-bottom:9px;background:${y.card}}
.uw .ter.off{opacity:.55;background:#FAFBFB}
.uw .doc{background:${y.card};border:1px solid ${y.rule};border-radius:9px;padding:30px 32px;font-family:'Newsreader',Georgia,serif;font-size:14px;line-height:1.62;color:#16202E}
.uw .doc h2{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:${y.pine};margin:22px 0 7px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;font-weight:600}
.uw .doc p{margin:0 0 11px;text-align:justify}
.uw .doc p.bl{margin:0 0 7px 16px;text-indent:-16px}
.uw .doc p.hd{text-align:center;font-weight:600;font-size:17px;letter-spacing:.02em;margin-bottom:18px}
.uw .doc p.rt{text-align:right;color:${y.ink45};font-size:13px}
.uw .doc table{width:100%;border-collapse:collapse;font-size:12.5px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;margin:4px 0 12px}
.uw .doc table td{border:1px solid ${y.rule};padding:6px 8px;vertical-align:top;text-align:left}
.uw .doc table td:first-child{width:30%;background:#F6F8F8;font-weight:600}
.uw .doc p.ref{font-size:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;margin:0 0 8px;text-align:left;color:#2A3341}
.uw .gap{color:${y.alert};background:#FBEFEF;padding:0 3px;border-radius:2px}
@media(max-width:640px){.uw .doc{padding:20px 18px}}
@media(prefers-reduced-motion:reduce){.uw *{transition:none!important;animation:none!important}}
