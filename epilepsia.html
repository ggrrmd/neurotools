<script>/* Dados do médico (salvos neste navegador em "Dados do médico") usados nos documentos */
window.NTMED = (function () {
  function c() { try { return JSON.parse(localStorage.getItem('lme_cfg') || 'null') || {}; } catch (e) { return {}; } }
  function rot(r, v) { v = String(v || '').trim(); if (!v) return ''; return new RegExp('^' + r + '\\b', 'i').test(v) ? v : r + ': ' + v; }
  return {
    get nome() { var x = c(); return x.medicoNomeCurto || x.medicoNome || '[nome do médico]'; },
    get crm() { return rot('CRM', c().crm) || 'CRM: [número]'; },
    get rqe() { return rot('RQE', c().rqe); },
    get especialidade() { return c().especialidade || 'Neurologista'; },
    get registro() { var x = c(); return [rot('CRM', x.crm) || 'CRM: [número]', rot('RQE', x.rqe), x.especialidade || 'Neurologista'].filter(Boolean).join(' | '); },
    get cidade() { return c().cidade || ''; },
    get endereco() { var x = c(); return [x.endereco, x.cidade, x.uf].filter(Boolean).join(', '); },
    get contato() { var x = c(); return [x.email, x.telefone].filter(Boolean).join(' | '); }
  };
})();</script>
<script>/* Ponte entre cada ferramenta (carregada dentro do menu) e o artefato.
   Só age quando a página está dentro do Neurotools publicado como artefato;
   fora dele não faz nada. */
(function () {
  var host = null;
  try { host = window.parent !== window ? window.parent.auxNeuroHost : null; } catch (e) { host = null; }
  if (!host) return;

  // A coluna lateral do Neurotools substitui o botão flutuante "Menu".
  try {
    var est = document.createElement("style");
    est.textContent = "#auxneuro-menu{display:none!important}";
    (document.head || document.documentElement).appendChild(est);
  } catch (e) {}

  // Repassa à ferramenta os recursos do Claude que o menu recebe
  // (salvamento de arquivos e arquivo de pacientes do LME).
  // Arquivos e dados criados aqui são recriados na página principal (structuredClone dela)
  // antes de chegar ao Claude, que só aceita objetos da página principal.
  try {
    var pai = window.parent;
    if (!window.claude && pai.claude && typeof pai.claude.use === "function") {
      var clonar = function (x) { return (x === undefined || x === null || typeof x !== "object") ? x : pai.structuredClone(x); };
      var embrulharDoc = function (d) {
        return {
          set: function (dados, opc) { return d.set(clonar(dados), clonar(opc)); },
          update: function (dados) { return d.update(clonar(dados)); },
          delete: function () { return d.delete(); },
          get: function () { return d.get(); },
          onSnapshot: function (a, b) { return d.onSnapshot(a, b); }
        };
      };
      var embrulharCol = function (c) {
        return {
          doc: function (id) { return embrulharDoc(c.doc(id)); },
          onSnapshot: function (a, b) { return c.onSnapshot(a, b); },
          get: function () { return c.get(); }
        };
      };
      window.claude = {
        use: function (nome) {
          return pai.claude.use(nome).then(function (ns) {
            if (!ns) return ns;
            if (nome === "downloads") {
              return { save: function (req) { return ns.save({ filename: req.filename, data: clonar(req.data) }); } };
            }
            if (nome === "db") {
              return {
                collection: function (p) { return embrulharCol(ns.collection(p)); },
                doc: function (p) { return embrulharDoc(ns.doc(p)); }
              };
            }
            return ns;
          });
        }
      };
    }
  } catch (e) {}

  // Guarda os arquivos gerados para entregá-los ao salvamento do artefato.
  var blobs = new Map();
  var criar = URL.createObjectURL;
  URL.createObjectURL = function (obj) {
    var url = criar.call(URL, obj);
    if (obj instanceof Blob) blobs.set(url, obj);
    return url;
  };

  function ehArquivo(a) {
    return a && a.hasAttribute && a.hasAttribute("download") && /^(blob:|data:)/i.test(a.href || "");
  }
  function salvar(a) {
    var nome = a.getAttribute("download") || "arquivo";
    var blob = blobs.get(a.href);
    var pronto = blob ? Promise.resolve(blob) : fetch(a.href).then(function (r) { return r.blob(); });
    pronto.then(function (b) { host.salvar(nome, b); }, function () { host.aviso("Não foi possível preparar o arquivo."); });
  }

  // Downloads disparados por código (a.click()) e por clique do usuário.
  var clicar = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (ehArquivo(this)) { salvar(this); return; }
    return clicar.call(this);
  };
  document.addEventListener("click", function (e) {
    var alvo = e.target && e.target.closest ? e.target : null;
    if (!alvo) return;
    var menu = alvo.closest("#auxneuro-menu");
    if (menu) { e.preventDefault(); host.voltar(); return; }
    var a = alvo.closest("a[download]");
    if (ehArquivo(a)) { e.preventDefault(); salvar(a); }
  }, true);

  // O artefato não exibe confirm()/alert(): a ação confirma direto e o aviso vira mensagem na tela.
  window.confirm = function () { return true; };
  window.alert = function (m) { host.aviso(String(m)); };
})();
</script>

@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&display=swap');
.wrap{--bg:#FBFBF8;--card:#fff;--ink:#101B2D;--muted:#6F7889;--line:#DDE1E6;--accent:#1F4B3F;--accent-soft:#E9EEEB;
  --sai:#FDF3DC;--sai-ink:#7A5A12;--entra:#DCE7E1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg);
  min-height:100vh;padding:20px 20px 32px;box-sizing:border-box}
.wrap *{box-sizing:border-box}
.head,.tabs,.troca,.nota{max-width:1080px;margin-left:auto;margin-right:auto}
.head{margin-bottom:14px}
.title{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:25px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.headnote{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{border:none;background:none;padding:9px 14px;font-weight:600;font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.tag{font-size:10.5px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;font-weight:700}
.tsai{background:var(--sai);color:var(--sai-ink)}
.tentra{background:var(--entra);color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols .card{margin-bottom:0}
.cols{margin-bottom:16px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;margin-bottom:12px;min-width:0}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;color:var(--ink);background:#fcfcfb;font-weight:400}
.f textarea{resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media(max-width:520px){.row3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row3>:first-child{grid-column:1/-1}}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 10px;line-height:1.45}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 10px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.etapas{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfcfb}
.etapas-tit{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.etapas table{width:100%;border-collapse:collapse;font-size:13px}
.etapas th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:4px 4px}
.etapas td{padding:5px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.etapas .inl{display:inline-flex;align-items:center;gap:6px}
.etapas input{width:76px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit}
.emdiante{font-style:italic;color:var(--muted)}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-weight:600;font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.add{margin-top:8px}
.tabwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.crono{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;font-variant-numeric:tabular-nums}
.crono th{font-size:11.5px;font-weight:700;padding:7px 8px;border-bottom:1px solid var(--line);background:var(--accent-soft);text-align:center}
.crono th.hsai{background:var(--sai);color:var(--sai-ink)}
.crono th.hentra{background:var(--entra);color:var(--accent)}
.crono td{padding:8px;border-top:1px solid var(--line);text-align:center}
.crono td.per{text-align:left;font-weight:600;white-space:nowrap}
.crono td.muted{color:var(--muted);font-style:italic}
.crono td.txt{font-size:12px}
.crono tr.final td{background:#F4F8F5;font-weight:600}
.acoes{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.acoes .hint{margin:0}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:13.5px;font-family:inherit;padding:10px 16px;border-radius:9px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.erro{color:#b3261e;font-size:12.5px}
.nota{font-size:11.5px;color:var(--muted);line-height:1.5}
