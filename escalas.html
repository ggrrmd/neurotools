<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escalas</title><style>:root{
  --paper:#FBFBF8; --card:#FFFFFF; --ink:#101B2D; --ink70:#4A5468; --ink45:#6F7889;
  --rule:#DDE1E6; --pine:#1F4B3F; --pine-ink:#FBFBF8; --chip:#E9EEEB; --chip-ink:#33413B; --sage:#93B7A9;
  --soft:#F3F5F2; --warn:#7A4A0B; --warn-bg:#FFF4DE;
  --g1:#E7F1EC; --g2:#EEF2E0; --g3:#FBEEDC; --g4:#F8E1DE;
  --g1i:#1F4B3F; --g2i:#4C5A1E; --g3i:#7A4A0B; --g4i:#8A2A1F;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.5 var(--sans);
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:880px;margin:0 auto}
.cab{padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.cab .area{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pine)}
.cab h1{font:700 25px/1.15 var(--serif);margin:2px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.cab .sub{margin:0;color:var(--ink70);font-size:14px}
.vazio{padding:60px 10px;text-align:center;color:var(--ink45)}

.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 16px 12px;margin-bottom:14px}
.card h2{font:700 17px/1.25 var(--serif);margin:0 0 4px;display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.card h2 .sub{font:600 12px var(--sans);color:var(--ink45);white-space:nowrap}
.card .dica{margin:0 0 10px;color:var(--ink70);font-size:13.5px}
.card .dica:last-child{margin-bottom:4px}

/* itens pontuados */
.it{padding:10px 0;border-top:1px solid var(--rule)}
.card h2+.it,.card .dica+.it,.it:first-child{border-top:0}
.enun{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:7px}
.enun .t{display:block}
.enun .ajuda{display:block;color:var(--ink45);font-size:12.5px;margin-top:1px}
.n{flex:none;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--chip);color:var(--chip-ink);font-size:11.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center}
.ops{display:flex;flex-direction:column;gap:4px;padding-left:34px}
.op{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid var(--rule);background:#fff;border-radius:9px;padding:6px 10px;
  cursor:pointer;font-size:13.5px;line-height:1.35;min-height:36px}
.op b{flex:none;min-width:22px;font-weight:700;color:var(--pine);text-align:center}
.op:hover{border-color:var(--sage)}
.op[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.op[aria-pressed="true"] b{color:var(--pine-ink)}
.op:focus-visible{outline:3px solid var(--sage);outline-offset:1px}
.it.compacto .ops{flex-direction:row;flex-wrap:wrap}
.it.compacto .op{flex:1 1 0;min-width:64px;flex-direction:column;align-items:center;gap:1px;text-align:center;padding:6px 4px;font-size:12.5px}
.it.compacto .op b{min-width:0}
.it.compacto.semvalor .op b{display:none}
@media (max-width:560px){.ops{padding-left:0}.it.compacto .op{min-width:52px;font-size:12px}}

/* checklist */
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--rule);cursor:pointer;font-size:14px;line-height:1.4}
.card h2+.ck,.card .dica+.ck{border-top:0}
.ck input{width:19px;height:19px;margin:1px 0 0;flex:none;accent-color:var(--pine)}
.ck .cod{flex:none;font-size:11.5px;font-weight:700;color:var(--pine);min-width:26px;padding-top:2px}
.ck small{display:block;color:var(--ink45);font-size:12.5px}

/* campos */
.campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;margin:4px 0 8px}
.campo{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink70)}
.campo.largo{grid-column:1 / -1}
.campo input,.campo select,.campo textarea{border:1px solid var(--rule);border-radius:9px;padding:7px 9px;background:#fff;font-size:15px;color:var(--ink);min-height:38px;width:100%}
.campo textarea{min-height:64px;resize:vertical;font-size:14px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:3px solid var(--sage);outline-offset:0;border-color:var(--pine)}
.campo .un{font-size:11.5px;color:var(--ink45)}
.grupo-bt{display:flex;flex-wrap:wrap;gap:5px}
.grupo-bt .op{min-height:34px;padding:6px 11px;align-items:center}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0}
.tb th,.tb td{text-align:left;padding:6px 7px;border-top:1px solid var(--rule);vertical-align:top}
.tb th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink45);font-weight:700;border-top:0}
.tb td.num,.tb th.num{text-align:right;white-space:nowrap}
.tb input,.tb select{border:1px solid var(--rule);border-radius:8px;padding:5px 7px;background:#fff;font-size:14px;width:100%;min-height:34px}
.tb input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--pine)}
.rolavel{overflow-x:auto}

.caixa{border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin:8px 0}
.caixa.info{background:var(--soft);color:var(--ink70)}
.caixa.alerta{background:var(--warn-bg);color:var(--warn)}
.caixa.ok{background:var(--g1);color:var(--g1i)}
.caixa.ruim{background:var(--g4);color:var(--g4i)}
.caixa ul{margin:4px 0 0;padding-left:18px}
.caixa li{margin:2px 0}
.mini{font-size:12.5px;color:var(--ink45)}
.btn{border:1px solid var(--rule);background:#fff;border-radius:9px;min-height:36px;padding:0 13px;cursor:pointer;font-size:13.5px;font-weight:600}
.btn.prim{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.btn.peq{min-height:30px;padding:0 10px;font-size:12.5px}

/* resultado */
.res{position:sticky;bottom:10px;z-index:5;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-top:6px;
  box-shadow:0 6px 22px rgba(16,27,45,.10);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.placar{font:700 30px/1 var(--serif);min-width:58px;text-align:center}
.placar small{display:block;font:600 11px/1.3 var(--sans);color:var(--ink45);margin-top:4px;white-space:nowrap}
.grau{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink)}
.grau.g1{background:var(--g1);color:var(--g1i)} .grau.g2{background:var(--g2);color:var(--g2i)}
.grau.g3{background:var(--g3);color:var(--g3i)} .grau.g4{background:var(--g4);color:var(--g4i)}
.frase{font-size:13px;color:var(--ink70);margin-top:5px;max-height:5.6em;overflow:auto}
.acoes{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.res .alerta{grid-column:1 / -1;background:var(--warn-bg);color:var(--warn);font-size:12.5px;border-radius:8px;padding:6px 10px}
.res .alerta[hidden]{display:none}

.refs{margin-top:16px;font-size:12.5px;color:var(--ink45);line-height:1.55}
.refs summary{cursor:pointer;font-weight:600;color:var(--ink70)}
.refs ol{padding-left:18px;margin:6px 0 0}
.refs li{margin-bottom:5px}
.nota{font-size:12.5px;color:var(--ink45);line-height:1.6;margin:12px 0 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:#101B2D;color:#FBFBF8;font-size:13.5px;padding:9px 14px;border-radius:10px;z-index:60}
#toast[hidden]{display:none}
@media (max-width:600px){html{zoom:1.12}}
@media print{.acoes{display:none}.res{position:static;box-shadow:none}}
</style></head>
<body><div id="app"><div class="vazio">Escolha uma escala no menu.</div></div><div id="toast" role="status" aria-live="polite" hidden></div>
<script>/* Motor das escalas do Neurotools.
   Cada escala é registrada com NT.def({...}) e tem três formas:
   - tipo "pontos": itens com opções pontuadas, total e interpretação automáticos;
   - tipo "checklist": critérios marcáveis, com uma função avaliar() que dá a conclusão;
   - tipo livre: render() próprio e avaliar() próprio.
   Toda escala termina na barra de resultado com "Copiar para o prontuário". */
(function () {
  'use strict';
  var NT = window.NT = { defs: {}, estado: {}, res: {}, atual: null };
  var NT_minus;
  var host = null;
  try { host = window.parent !== window && window.parent.auxNeuroHost; } catch (e) { host = null; }

  // ---------- utilidades ----------
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
      if (c == null || c === false) return;
      e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    });
    return e;
  }
  function fmt(n, d) {
    if (n == null || isNaN(n)) return '-';
    var s = d == null ? String(Math.round(n * 100) / 100) : Number(n).toFixed(d);
    return s.replace('.', ',');
  }
  function num(v) {
    if (v == null || v === '') return null;
    var n = Number(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  }
  function minus(t) { return t && t.length > 1 && t.charAt(1) === t.charAt(1).toLowerCase() ? t.charAt(0).toLowerCase() + t.slice(1) : t; }
  NT_minus = minus;
  function limpo(html) { var d = document.createElement('div'); d.innerHTML = html; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
  NT.el = el; NT.fmt = fmt; NT.num = num; NT.limpo = limpo; NT.minus = minus;

  var tt = null;
  function avisar(msg) {
    if (host && host.aviso) { host.aviso(msg); return; }
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 3000);
  }
  function copiar(txt) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      avisar(ok ? 'Copiado. Cole no prontuário.' : 'Não foi possível copiar automaticamente.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { avisar('Copiado. Cole no prontuário.'); }, fallback);
    else fallback();
  }
  NT.avisar = avisar; NT.copiar = copiar;

  NT.def = function (d) { NT.defs[d.id] = d; };
  NT.lista = function () { return Object.keys(NT.defs).map(function (k) { var d = NT.defs[k]; return { id: d.id, nome: d.nome, area: d.area, alias: d.alias || '' }; }); };

  // ---------- kit para escalas livres ----------
  function kit(st, upd) {
    function campo(label, input, extra) {
      return el('label', { class: 'campo' + (extra && extra.largo ? ' largo' : '') }, [label ? el('span', { html: label }) : null, input, extra && extra.unid ? el('span', { class: 'un', text: extra.unid }) : null]);
    }
    var k = {
      el: el, fmt: fmt, num: num, st: st, upd: upd,
      card: function (titulo, dica, kids) {
        return el('div', { class: 'card' }, [titulo ? el('h2', { html: titulo }) : null, dica ? el('p', { class: 'dica', html: dica }) : null].concat(kids || []));
      },
      campos: function (kids) { return el('div', { class: 'campos' }, kids); },
      num: function (key, label, o) {
        o = o || {};
        var i = el('input', { type: 'text', inputmode: o.inteiro ? 'numeric' : 'decimal', placeholder: o.ph || '', value: st[key] == null ? '' : st[key] });
        i.addEventListener('input', function () { st[key] = i.value; upd(); });
        return campo(label, i, o);
      },
      txt: function (key, label, o) {
        o = o || {};
        var i = el('input', { type: o.tipo || 'text', placeholder: o.ph || '', value: st[key] == null ? '' : st[key] });
        i.addEventListener('input', function () { st[key] = i.value; upd(); });
        return campo(label, i, o);
      },
      area: function (key, label, o) {
        o = o || {};
        var i = el('textarea', { placeholder: o.ph || '' }); i.value = st[key] || '';
        i.addEventListener('input', function () { st[key] = i.value; upd(); });
        return campo(label, i, Object.assign({ largo: true }, o));
      },
      sel: function (key, label, opts, o) {
        o = o || {};
        var s = el('select');
        s.appendChild(el('option', { value: '', text: o.vazio || 'Selecione' }));
        opts.forEach(function (op) { var v = Array.isArray(op) ? op[0] : op, t = Array.isArray(op) ? op[1] : op; s.appendChild(el('option', { value: v, text: t })); });
        s.value = st[key] == null ? '' : st[key];
        s.addEventListener('change', function () { st[key] = s.value; upd(); if (o.aoMudar) o.aoMudar(s.value); });
        return campo(label, s, o);
      },
      chk: function (key, label, o) {
        o = o || {};
        var i = el('input', { type: 'checkbox' }); i.checked = !!st[key];
        i.addEventListener('change', function () { st[key] = i.checked; upd(); if (o.aoMudar) o.aoMudar(i.checked); });
        return el('label', { class: 'ck' }, [i, o.cod ? el('span', { class: 'cod', text: o.cod }) : null, el('span', null, [el('span', { html: label }), o.ajuda ? el('small', { html: o.ajuda }) : null])]);
      },
      botoes: function (key, label, opts, o) {
        o = o || {};
        var g = el('div', { class: 'grupo-bt' });
        opts.forEach(function (op) {
          var b = el('button', { type: 'button', class: 'op', 'aria-pressed': String(st[key] === op[0]) }, op[1]);
          b.addEventListener('click', function () {
            st[key] = st[key] === op[0] && !o.obrigatorio ? undefined : op[0];
            [].forEach.call(g.children, function (x, j) { x.setAttribute('aria-pressed', String(st[key] === opts[j][0])); });
            upd(); if (o.aoMudar) o.aoMudar(st[key]);
          });
          g.appendChild(b);
        });
        return el('div', { class: 'campo largo' }, [label ? el('span', { html: label }) : null, g]);
      },
      item: function (it) { return itemPontos(it, st, upd); },
      caixa: function (cls, html) { return el('div', { class: 'caixa ' + cls, html: html }); }
    };
    return k;
  }
  NT.kit = kit;

  // ---------- tipo "pontos" ----------
  function secoes(d) { return d.secoes || [{ nome: null, itens: d.itens }]; }
  function maxItem(it) { return it.opts.reduce(function (m, o) { return typeof o[0] === 'number' ? Math.max(m, o[0]) : m; }, 0) * (it.peso || 1); }
  function itemPontos(it, st, upd) {
    var compacto = it.compacto != null ? it.compacto : it.opts.every(function (o) { return String(o[1] || '').length <= 18; });
    var w = el('div', { class: 'it' + (compacto ? ' compacto' : '') + (it.semValor ? ' semvalor' : '') });
    w.appendChild(el('div', { class: 'enun' }, [it.n != null ? el('span', { class: 'n', text: it.n }) : null,
      el('div', null, [el('span', { class: 't', html: it.t }), it.ajuda ? el('small', { class: 'ajuda', html: it.ajuda }) : null])]));
    var ops = el('div', { class: 'ops' });
    it.opts.forEach(function (o, j) {
      var b = el('button', { type: 'button', class: 'op', 'aria-pressed': String(st[it.id] === o[0]) }, [it.semValor ? null : el('b', { text: typeof o[0] === 'number' ? fmt(o[0]) : o[0] }), o[1] ? el('span', { html: o[1] }) : null]);
      b.addEventListener('click', function () {
        if (st[it.id] === o[0]) delete st[it.id]; else st[it.id] = o[0];
        [].forEach.call(ops.children, function (x, i) { x.setAttribute('aria-pressed', String(st[it.id] === it.opts[i][0])); });
        upd();
      });
      ops.appendChild(b);
    });
    w.appendChild(ops);
    return w;
  }
  function renderPontos(d, st, corpo, upd) {
    secoes(d).forEach(function (sec) {
      var card = el('div', { class: 'card' });
      if (sec.nome) card.appendChild(el('h2', { html: sec.nome }));
      if (sec.dica) card.appendChild(el('p', { class: 'dica', html: sec.dica }));
      sec.itens.forEach(function (it) { card.appendChild(itemPontos(it, st, upd)); });
      corpo.appendChild(card);
    });
  }
  function rotuloOpc(it, v) { var o = it.opts.filter(function (x) { return x[0] === v; })[0]; return o ? limpo(o[1] || '') : ''; }
  NT.rotuloOpc = rotuloOpc;
  function avaliarPontos(d, st) {
    var tot = 0, resp = 0, n = 0, subt = [];
    secoes(d).forEach(function (s) {
      var sv = 0, r = 0, mx = 0;
      s.itens.forEach(function (it) {
        if (it.foraTotal) return;
        n++; mx += maxItem(it);
        var v = st[it.id];
        if (v !== undefined && typeof v === 'number') { r++; resp++; sv += (it.peso || 1) * v; }
        else if (v !== undefined) { r++; resp++; }
      });
      tot += sv;
      subt.push({ nome: s.nome, curto: s.curto || s.nome, v: sv, max: s.max != null ? s.max : mx, r: r, n: s.itens.filter(function (i) { return !i.foraTotal; }).length });
    });
    if (d.total) tot = d.total(st, subt);
    var r = { total: tot, resp: resp, n: n, subt: subt, completo: resp >= n };
    r.placar = resp ? fmt(tot) : '0';
    r.sufixo = resp < n ? resp + ' de ' + n + ' itens' : (d.max != null ? 'de ' + d.max : 'pontos');
    if (!resp) { r.rotulo = 'Preencha os itens'; return r; }
    if (d.exigeTodos && resp < n) { r.rotulo = 'Faltam ' + (n - resp) + (n - resp === 1 ? ' item' : ' itens'); return r; }
    var ip = d.interp ? d.interp(tot, st, r) || {} : {};
    r.rotulo = ip.rotulo || (resp < n ? 'Parcial' : 'Total'); r.classe = ip.classe; r.frase = ip.frase; r.alerta = ip.alerta;
    // texto para o prontuário
    var cab = (d.sigla || d.nome.split(' (')[0]) + ': ' + fmt(tot) + (d.max != null ? '/' + d.max : '') + (ip.rotulo ? ' (' + minus(ip.rotulo) + ')' : '') + '.';
    var linhas = [cab];
    if (resp < n) linhas.push('Aplicação incompleta: ' + resp + ' de ' + n + ' itens respondidos.');
    var modo = d.copia || (n <= 12 ? 'completa' : 'resumo');
    if (modo === 'completa') {
      secoes(d).forEach(function (s) {
        if (s.nome && secoes(d).length > 1) linhas.push((s.curto || limpo(s.nome)) + ':');
        s.itens.forEach(function (it) {
          var v = st[it.id]; if (v === undefined) return;
          var rot = rotuloOpc(it, v);
          linhas.push('- ' + (it.c || limpo(it.t)) + ': ' + (it.semValor ? rot : (typeof v === 'number' ? fmt(v) : v) + (rot ? ' (' + rot + ')' : '')));
        });
      });
    } else if (subt.length > 1) {
      linhas.push(subt.map(function (s) { return limpo(s.curto) + ' ' + fmt(s.v) + '/' + fmt(s.max); }).join('; ') + '.');
    }
    if (d.extraCopia) { var ex = d.extraCopia(st, r); if (ex) linhas = linhas.concat(ex); }
    if (ip.frase && d.fraseNaCopia !== false) linhas.push(limpo(ip.frase));
    r.copia = linhas.join('\n');
    return r;
  }
  NT.avaliarPontos = avaliarPontos;

  // ---------- tipo "checklist" ----------
  function renderChecklist(d, st, corpo, upd) {
    var k = kit(st, upd);
    d.grupos.forEach(function (g) {
      var card = el('div', { class: 'card' });
      if (g.nome) card.appendChild(el('h2', { html: g.nome }));
      if (g.dica) card.appendChild(el('p', { class: 'dica', html: g.dica }));
      if (g.botoes) card.appendChild(k.botoes(g.id, null, g.botoes));
      (g.itens || []).forEach(function (it) { card.appendChild(k.chk(it[0], it[1], { cod: it[2], ajuda: it[3] })); });
      corpo.appendChild(card);

      else c.appendChild(k.card('Afastamento', null, [k.campos([k.num('dias', 'Dias', { inteiro: true }), k.txt('ini', 'A partir de', { tipo: 'date' })]), k.chk('autCid', 'O paciente autoriza a inclusão do CID'), k.campos([k.txt('cid', 'CID-10')])]));
