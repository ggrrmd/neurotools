<!doctype html>
<html lang="pt-BR">
<head>
<script>/* Dados do médico (salvos neste aparelho em "Dados do médico") usados nos documentos */
window.NTMED = (function () {
  function c() { try { return JSON.parse(localStorage.getItem('lme_cfg') || 'null') || {}; } catch (e) { return {}; } }
  return {
    get nome() { var x = c(); return x.medicoNomeCurto || x.medicoNome || '[nome do médico]'; },
    get crm() { return c().crm || '[CRM]'; },
    get rqe() { return c().rqe || ''; },
    get especialidade() { return c().especialidade || 'Neurologista'; },
    get registro() { var x = c(); return [x.especialidade || 'Neurologista', x.crm || '[CRM]', x.rqe].filter(Boolean).join(' · '); },
    get cidade() { return c().cidade || ''; },
    get endereco() { var x = c(); return [x.endereco, x.cidade, x.uf].filter(Boolean).join(', '); },
    get contato() { var x = c(); return [x.email, x.telefone].filter(Boolean).join(' | '); }
  };
})();</script>
<script>/* Ponte entre cada ferramenta (carregada dentro do menu) e o artefato.
   Só age quando a página está dentro do Neurotools publicado como artefato;
   fora dele não faz nada. */
(function () {
  var host = null;
  try { host = window.parent !== window ? window.parent.auxNeuroHost : null; } catch (e) { host = null; }
  if (!host) return;

  // A coluna lateral do Neurotools substitui o botão flutuante "Menu".
  try {
    var est = document.createElement("style");
    est.textContent = "#auxneuro-menu{display:none!important}";
    (document.head || document.documentElement).appendChild(est);
  } catch (e) {}

  // Repassa à ferramenta os recursos do Claude que o menu recebe
  // (salvamento de arquivos e arquivo de pacientes do LME).
  // Arquivos e dados criados aqui são recriados na página principal (structuredClone dela)
  // antes de chegar ao Claude, que só aceita objetos da página principal.
  try {
    var pai = window.parent;
    if (!window.claude && pai.claude && typeof pai.claude.use === "function") {
      var clonar = function (x) { return (x === undefined || x === null || typeof x !== "object") ? x : pai.structuredClone(x); };
      var embrulharDoc = function (d) {
        return {
          set: function (dados, opc) { return d.set(clonar(dados), clonar(opc)); },
          update: function (dados) { return d.update(clonar(dados)); },
          delete: function () { return d.delete(); },
          get: function () { return d.get(); },
          onSnapshot: function (a, b) { return d.onSnapshot(a, b); }
        };
      };
      var embrulharCol = function (c) {
        return {
          doc: function (id) { return embrulharDoc(c.doc(id)); },
          onSnapshot: function (a, b) { return c.onSnapshot(a, b); },
          get: function () { return c.get(); }
        };
      };
      window.claude = {
        use: function (nome) {
          return pai.claude.use(nome).then(function (ns) {
            if (!ns) return ns;
            if (nome === "downloads") {
              return { save: function (req) { return ns.save({ filename: req.filename, data: clonar(req.data) }); } };
            }
            if (nome === "db") {
              return {
                collection: function (p) { return embrulharCol(ns.collection(p)); },
                doc: function (p) { return embrulharDoc(ns.doc(p)); }
              };
            }
            return ns;
          });
        }
      };
    }
  } catch (e) {}

  // Guarda os arquivos gerados para entregá-los ao salvamento do artefato.
  var blobs = new Map();
  var criar = URL.createObjectURL;
  URL.createObjectURL = function (obj) {
    var url = criar.call(URL, obj);
    if (obj instanceof Blob) blobs.set(url, obj);
    return url;
  };

  function ehArquivo(a) {
    return a && a.hasAttribute && a.hasAttribute("download") && /^(blob:|data:)/i.test(a.href || "");
  }
  function salvar(a) {
    var nome = a.getAttribute("download") || "arquivo";
    var blob = blobs.get(a.href);
    var pronto = blob ? Promise.resolve(blob) : fetch(a.href).then(function (r) { return r.blob(); });
    pronto.then(function (b) { host.salvar(nome, b); }, function () { host.aviso("Não foi possível preparar o arquivo."); });
  }

  // Downloads disparados por código (a.click()) e por clique do usuário.
  var clicar = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (ehArquivo(this)) { salvar(this); return; }
    return clicar.call(this);
  };
  document.addEventListener("click", function (e) {
    var alvo = e.target && e.target.closest ? e.target : null;
    if (!alvo) return;
    var menu = alvo.closest("#auxneuro-menu");
    if (menu) { e.preventDefault(); host.voltar(); return; }
    var a = alvo.closest("a[download]");
    if (ehArquivo(a)) { e.preventDefault(); salvar(a); }
  }, true);

  // O artefato não exibe confirm()/alert(): a ação confirma direto e o aviso vira mensagem na tela.
  window.confirm = function () { return true; };
  window.alert = function (m) { host.aviso(String(m)); };
})();
</script>

        @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&display=swap');
        .wrap{
          --bg:#FBFBF8; --card:#ffffff; --ink:#101B2D; --muted:#6F7889;
          --line:#DDE1E6; --accent:#1F4B3F; --accent-soft:#E9EEEB;
          --curve:#3a4a5a; --mean:#9aa4ae; --axis:#c9cdd2;
          --band:#EEF2EF; --fill:#93B7A9; --patient:#c8562f;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
          color:var(--ink); background:var(--bg);
          min-height:100vh; padding:20px 20px 28px; box-sizing:border-box;
        }
        .wrap *{box-sizing:border-box;}
        .head{max-width:900px;margin:0 auto 14px;}
        .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;}
        .title{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:25px;font-weight:600;line-height:1.15;margin:0;letter-spacing:-.01em;}
        .headnote{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45;}
        .sub{font-size:13px;color:var(--muted);}
        .author{font-size:12.5px;color:var(--ink);font-weight:600;margin-top:10px;}
        .updated{font-size:11.5px;color:var(--muted);margin-top:2px;}
        .devwarn{
          font-size:11.5px;color:#7a3016;background:#fbeee9;border:1px solid #ecccbe;
          border-radius:8px;padding:8px 11px;margin-top:10px;line-height:1.45;max-width:640px;
        }
        .grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        @media(max-width:720px){.grid{grid-template-columns:1fr;}}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;}
        .card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600;}
        label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:0 0 5px;}
        select,input{
          width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
          font-size:14px;font-family:inherit;color:var(--ink);background:#fcfcfb;
          transition:border-color .15s;
        }
        select:focus,input:focus{outline:none;border-color:var(--accent);}
        .field{margin-bottom:13px;}
        .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
        .ref{font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:13px;font-style:italic;}
        .resultline{
          background:var(--accent-soft);border:1px solid #C3D6CE;border-radius:10px;
          padding:14px 15px;font-size:15px;font-weight:600;color:#1F4B3F;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          display:flex;align-items:center;justify-content:space-between;gap:10px;
        }
        .copybtn{
          border:1px solid var(--accent);background:var(--accent);color:#fff;
          font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;
          white-space:nowrap;font-family:inherit;transition:opacity .15s;
        }
        .copybtn:hover{opacity:.88;}
        .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:12px;color:var(--muted);}
        .meta b{color:var(--ink);font-weight:600;}
        .interp{margin-top:12px;font-size:13px;color:var(--ink);}
        .interp .tag{
          display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;
          background:var(--band);color:var(--accent);
        }
        .empty{color:var(--muted);font-size:13px;padding:26px 0;text-align:center;}
        .legend{display:flex;gap:16px;margin-top:6px;font-size:11px;color:var(--muted);flex-wrap:wrap;}
        .legend span{display:inline-flex;align-items:center;gap:5px;}
        .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
        .note{max-width:900px;margin:16px auto 0;font-size:11px;color:var(--muted);line-height:1.5;}

        .tabs{max-width:900px;margin:0 auto 16px;display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
        .tab{
          border:none;background:none;padding:9px 14px;font-size:13px;font-weight:600;font-family:inherit;
          color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
        }
        .tab:hover{color:var(--ink);}
        .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
        .single{max-width:900px;margin:0 auto;}

        .qintro{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
        .qitems{display:flex;flex-direction:column;gap:14px;}
        .qitem{border-bottom:1px solid var(--line);padding-bottom:14px;}
        .qitem:last-child{border-bottom:none;}
        .qtext{font-size:13.5px;margin-bottom:9px;line-height:1.4;}
        .qopts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
        .qopts.col{grid-template-columns:1fr;}
        .opt{
          display:flex;align-items:center;gap:9px;text-align:left;padding:8px 10px;
          border:1px solid var(--line);border-radius:9px;background:#fcfcfb;cursor:pointer;
          font-family:inherit;font-size:12.5px;color:var(--ink);transition:all .12s;
        }
        .opt:hover{border-color:var(--accent);background:#fff;}
        .opt.sel{border-color:var(--accent);background:var(--accent-soft);}
        .optn{
          flex:none;width:22px;height:22px;border-radius:6px;background:var(--band);
          display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
          color:var(--accent);font-family:ui-monospace,monospace;
        }
        .opt.sel .optn{background:var(--accent);color:#fff;}
        .optl{line-height:1.3;}

        .scorebar{
          margin-top:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
          padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fafaf8;
        }
        .scoreval{font-size:30px;font-weight:700;font-family:ui-monospace,monospace;line-height:1;}
        .scoreval span{font-size:15px;color:var(--muted);font-weight:600;}
        .scoremeta{font-size:11px;color:var(--muted);margin-top:4px;}
        .scoreright{flex:1;min-width:150px;}
        .scorelevel{font-size:15px;font-weight:700;}
        .scoredetail{font-size:12px;color:var(--muted);margin-top:2px;}
        .scorebar.good{background:#eef5ee;border-color:#cfe0cf;}
        .scorebar.good .scorelevel{color:#2f6f3a;}
        .scorebar.danger{background:#fbeee9;border-color:#ecccbe;}
        .scorebar.danger .scorelevel{color:#b0451f;}
        .scorebar.tone-ok{background:#eef5ee;border-color:#cfe0cf;}
        .scorebar.tone-ok .scorelevel{color:#2f6f3a;}
        .scorebar.tone-mild{background:#fdf6e7;border-color:#ecdcae;}
        .scorebar.tone-mild .scorelevel{color:#8a6d1a;}
        .scorebar.tone-mod{background:#fbeee9;border-color:#ecccbe;}
        .scorebar.tone-mod .scorelevel{color:#b0451f;}
        .scorebar.tone-severe{background:#f7e6e6;border-color:#e2b6b6;}
        .scorebar.tone-severe .scorelevel{color:#9c2626;}
        .qfoot{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5;}

        .reflist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px;}
        .reflist li{font-size:12.5px;line-height:1.55;color:var(--ink);}
        .reftag{
          display:inline-block;margin-right:8px;padding:1px 8px;border-radius:20px;
          background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;
        }

        .aa{max-width:900px;margin:0 auto;}
        .aacols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        @media(max-width:720px){.aacols{grid-template-columns:1fr;}}
        .chks{display:flex;flex-direction:column;gap:7px;}
        .chk{
          display:flex;align-items:center;gap:10px;text-align:left;padding:9px 11px;
          border:1px solid var(--line);border-radius:9px;background:#fcfcfb;cursor:pointer;
          font-family:inherit;font-size:12.5px;color:var(--ink);transition:all .12s;
        }
        .chk:hover{border-color:var(--accent);}
        .chk.on{border-color:var(--patient);background:#fbeee9;}
        .chkbox{
          flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);
          display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;
        }
        .chk.on .chkbox{background:var(--patient);border-color:var(--patient);}
        .verdict{border-radius:11px;padding:14px 15px;margin-bottom:16px;}
        .verdict.ok{background:#eef5ee;border:1px solid #cfe0cf;}
        .verdict.no{background:#fbeee9;border:1px solid #ecccbe;}
        .vtitle{font-size:17px;font-weight:700;}
        .verdict.ok .vtitle{color:#2f6f3a;}
        .verdict.no .vtitle{color:#b0451f;}
        .vsub{font-size:12.5px;color:var(--muted);margin-top:3px;}
        .reasons{margin:9px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;}
        .reasons li{font-size:12.5px;line-height:1.4;color:#7a3016;}
        .drugpick{margin-bottom:14px;}
        .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
        .seg button{
          flex:1;padding:9px;border:none;background:#fcfcfb;font-family:inherit;font-size:13px;
          font-weight:600;color:var(--muted);cursor:pointer;transition:all .12s;
        }
        .seg button.on{background:var(--accent);color:#fff;}
        .seg button+button{border-left:1px solid var(--line);}
        .scheme{border:1px solid var(--line);border-radius:11px;overflow:hidden;}
        .schemehead{
          display:flex;justify-content:space-between;align-items:center;gap:10px;
          padding:11px 14px;background:var(--accent-soft);font-size:13px;font-weight:700;color:#1F4B3F;
        }
        .schemesec{padding:11px 14px;border-top:1px solid var(--line);}
        .schemelabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;}
        .schemesec ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:5px;}
        .schemesec li{font-size:12.5px;line-height:1.45;}
        .tlmeta{font-size:12px;color:var(--muted);margin-bottom:14px;}
        .tl{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:6px;position:relative;}
        .tlnode{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;position:relative;}
        .tlnode:not(.basal)::before{
          content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0;
        }
        .tldot{
          width:15px;height:15px;border-radius:50%;background:#d3d7db;border:2px solid #fff;
          box-shadow:0 0 0 1px var(--line);z-index:1;
        }
        .tldot.mr{background:var(--accent);box-shadow:0 0 0 1px var(--accent);}
        .tlnum{font-size:10px;color:var(--muted);margin-top:6px;font-family:ui-monospace,monospace;}
        .tllabel{font-size:10px;font-weight:700;color:var(--accent);margin-top:2px;}
        .tlnode.basal .tllabel{margin-top:6px;}
        .tllegend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--muted);}
        .tllegend .ld{width:11px;height:11px;border-radius:50%;background:#d3d7db;display:inline-block;margin-right:5px;vertical-align:middle;}
        .tllegend .ld.mr{background:var(--accent);}
        .cdrprim{font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:20px;margin-left:8px;text-transform:uppercase;letter-spacing:.04em;}
        .cdropts{display:flex;flex-direction:column;gap:6px;}
        .cdropt{
          display:flex;align-items:flex-start;gap:10px;text-align:left;padding:9px 11px;
          border:1px solid var(--line);border-radius:9px;background:#fcfcfb;cursor:pointer;
          font-family:inherit;font-size:12.5px;color:var(--ink);transition:all .12s;
        }
        .cdropt:hover{border-color:var(--accent);background:#fff;}
        .cdropt.sel{border-color:var(--accent);background:var(--accent-soft);}
        .cdrnum{
          flex:none;width:26px;height:26px;border-radius:6px;background:var(--band);
          display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;
          color:var(--accent);font-family:ui-monospace,monospace;
        }
        .cdropt.sel .cdrnum{background:var(--accent);color:#fff;}
        .cdrdesc{line-height:1.35;padding-top:3px;}
        .fastlist{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
        .fastgrp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:10px 0 2px;}
        .fastrow{display:flex;align-items:stretch;gap:6px;}
        .fastchk{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:9px 11px;
          border:1px solid var(--line);border-radius:9px;background:#fcfcfb;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink);transition:all .12s;}
        .fastchk:hover{border-color:var(--accent);background:#fff;}
        .fastrow.on .fastchk{border-color:var(--accent);background:var(--accent-soft);}
        .fastrow.atual .fastchk{box-shadow:inset 3px 0 0 var(--accent);}
        .fastrow.lacuna .fastchk{border-color:#e0b25a;background:#fdf6e7;}
        .fastbox{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-top:2px;}
        .fastrow.on .fastbox{background:var(--accent);border-color:var(--accent);}
        .fastst{flex:none;min-width:26px;font-family:ui-monospace,monospace;font-weight:700;font-size:13px;color:var(--accent);padding-top:3px;}
        .fastdesc{line-height:1.4;padding-top:2px;}
        .fastate{flex:none;align-self:center;border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;padding:6px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;}
        .fastate:hover{border-color:var(--accent);color:var(--accent);}
        @media(max-width:560px){.fastrow{flex-direction:column}.fastate{align-self:flex-end}}
        .fastwarn{margin-top:12px;font-size:12.5px;line-height:1.5;color:#7a5a12;background:#fdf6e7;border:1px solid #ecdcae;border-radius:10px;padding:10px 12px;}
        .fastpreview{margin-top:14px;font-size:13px;line-height:1.55;background:#fafaf8;border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
        .meemrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
        .meemtext{flex:1;min-width:180px;}
        .meemlabel{font-size:13.5px;font-weight:600;}
        .meemmax{color:var(--muted);font-weight:600;font-size:12px;font-family:ui-monospace,monospace;}
        .meemdesc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35;}
        .meemopts{display:flex;gap:5px;flex-wrap:wrap;}
        .meemopt{
          width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fcfcfb;
          font-family:ui-monospace,monospace;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;
          transition:all .12s;
        }
        .meemopt:hover{border-color:var(--accent);}
        .meemopt.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
        .meembtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
        .wordbtn{
          border:1px solid var(--accent);background:#fff;color:var(--accent);
          font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;
          font-family:inherit;transition:all .15s;
        }
        .wordbtn:hover{background:var(--accent-soft);}
        .wordbtn:disabled{opacity:.6;cursor:default;}
